name: Build and Test Source

on:
  push:
    branches:
      - main
      - develop
      - qa
      - staging
      - production
  pull_request:
    branches:
      - main
      - develop
      - qa
      - staging

env:
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/.m2/repository"
  JAVA_VERSION: "8"               
  WORKING_DIR: "serviciosstd_ws" 

jobs:
  build:
    name: Build App1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Verify Java and Maven version
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version

      # ── SOLUCIÓN AL ERROR DE DEPENDENCIAS ──
      # Asegúrate de subir los archivos JAR a una carpeta llamada 'add-ons' dentro de 'serviciosstd_ws'
      - name: Install Private Corporate Jars to Local Runner Cache
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Instalando dependencias propietarias en el repositorio local del Runner..."
          mvn install:install-file -Dfile=add-ons/WS_DATOS.jar -DgroupId=org -DartifactId=WS_DATOS -Dversion=1.0 -Dpackaging=jar -B || echo "Validar si el jar se llama diferente"
          mvn install:install-file -Dfile=add-ons/WS_PLASTICOS.jar -DgroupId=org -DartifactId=WS_PLASTICOS -Dversion=1.0 -Dpackaging=jar -B
          mvn install:install-file -Dfile=add-ons/Commons.jar -DgroupId=com.mx -DartifactId=Commons -Dversion=1 -Dpackaging=jar -B
      
      - name: Build App1 (Compile)
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean compile -DskipTests -U -B
      
      - name: Save build cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ${{ env.WORKING_DIR }}/target/
            ${{ github.workspace }}/.m2/repository/
          key: build-${{ github.sha }}

  test:
    name: Run Tests & Sonar Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   
      checks: write     
      pull-requests: write 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKING_DIR }}/target/
            ${{ github.workspace }}/.m2/repository/
          key: build-${{ github.sha }}
          fail-on-cache-miss: false
      
      - name: Run unit and integrated tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn test verify -B
      
      - name: SonarQube Analysis
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ServiciosSTD_WS \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -B
      
      - name: Create PR to Staging
        if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          echo "Verificando si ya existe un PR abierto de QA hacia Staging..."
          PR_EXISTS=$(gh pr list --head qa --base staging --state open --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ]; then
            echo "Creando nuevo Pull Request hacia la rama Staging..."
            gh pr create \
              --head qa \
              --base staging \
              --title "🚀 QA a Staging: Despliegue automático (Build #${{ github.run_number }})" \
              --body "El pipeline de GitHub pasó las validaciones básicas sobre la rama qa de ServiciosSTD_WS."
          else
            echo "Ya existe un Pull Request abierto (#$PR_EXISTS). No es necesario crear uno nuevo."
          fi