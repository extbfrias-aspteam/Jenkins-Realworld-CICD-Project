name: APC_LIberaciones_2026

on:
  push:
    branches:
      - qa

jobs:
  build:
    name: Pipeline Incremental 2026
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Actualizado a v4 para evitar advertencias de Node
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # <-- ESTO SOLUCIONA TU ERROR GENERAL

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Detecta qué archivos cambiaron en este push específico
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45

      # Analiza de forma quirúrgica solo los directorios con cambios
      - name: Dynamic and Incremental Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PROCESSED_POMS=""

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            CURRENT_DIR=$(dirname "$file")
            
            # Buscamos el pom.xml más cercano hacia atrás en la estructura
            while [ "$CURRENT_DIR" != "." ] && [ "$CURRENT_DIR" != "/" ]; do
              if [ -f "$CURRENT_DIR/pom.xml" ]; then
                POM_PATH="$CURRENT_DIR/pom.xml"
                
                # Evitamos duplicar análisis si se modificaron varios archivos del mismo módulo
                if [[ "$PROCESSED_POMS" == *"$POM_PATH"* ]]; then
                  break
                fi

                MODULE_NAME=$(basename "$CURRENT_DIR")
                
                echo "=========================================================="
                echo "MODIFICACIÓN DETECTADA EN: $MODULE_NAME"
                echo "Iniciando análisis independiente en SonarQube..."
                echo "=========================================================="
                
                # Ejecuta Maven solo para esta aplicación usando su propio nombre como llave
                mvn -B -f "$POM_PATH" verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
                  -Dsonar.projectKey="asp-proyecto_${MODULE_NAME}" \
                  -Dsonar.projectName="${MODULE_NAME}" \
                  -Dsonar.scm.provider=git

                PROCESSED_POMS="$PROCESSED_POMS $POM_PATH"
                break
              fi
              CURRENT_DIR=$(dirname "$CURRENT_DIR")
            done
          done

          if [ -z "$PROCESSED_POMS" ]; then
            echo "No se encontraron cambios en proyectos Java/Maven. Fin del pipeline."
          fi