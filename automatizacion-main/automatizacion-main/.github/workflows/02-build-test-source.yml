name: Build and Test Source

on:
  push:
    branches:
      - main
      - develop
      - qa
      - staging
      - production
  pull_request:
    branches:
      - main
      - develop
      - qa
      - staging

env:
  # Se actualizó la ruta del repositorio Maven al subdirectorio correcto
  MAVEN_OPTS: "-Dmaven.repo.local=${{ github.workspace }}/automatizacion-main/automatizacion-main/java-app/.m2/repository"
  JAVA_VERSION: "17"
  # Definimos la ruta del proyecto como variable para no repetir texto
  WORKING_DIR: "automatizacion-main/automatizacion-main/java-app"

jobs:
  build:
    name: Build App1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido por SonarQube para comparar el historial de Git
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Verify Java version
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version
      
      - name: Build App1
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean package -DskipTests
      
      - name: Save build cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ${{ env.WORKING_DIR }}/target/
            ${{ env.WORKING_DIR }}/.m2/repository/
          key: build-${{ github.sha }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: |
            ${{ env.WORKING_DIR }}/target/*.war
            ${{ env.WORKING_DIR }}/target/*.ear
            ${{ env.WORKING_DIR }}/target/*.jar
          retention-days: 30

  test:
    name: Run Tests & Sonar Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido también aquí para el mapeo de líneas en Sonar
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORKING_DIR }}/target/
            ${{ env.WORKING_DIR }}/.m2/repository/
          key: build-${{ github.sha }}
          fail-on-cache-miss: true
      
      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn test
      
      # 🚀 NUEVO PASO: Análisis de SonarQube ejecutado en el subdirectorio
      - name: SonarQube Analysis
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=ASP-POC
      
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ${{ env.WORKING_DIR }}/target/surefire-reports/TEST-*.xml
