# =============================================================================
# java-maven.gitlab-ci.yml
# Template GitLab CI/CD reutilizable para proyectos Java/Maven
#
# USO - en el .gitlab-ci.yml de cada proyecto:
#   include:
#     - project: 'infra-neo/automatizacion'
#       ref: main
#       file: '/cicd/gitlab/templates/java-maven.gitlab-ci.yml'
#
# Variables requeridas (configurar en GitLab > Settings > CI/CD > Variables):
#   NEXUS_URL      : http://nexus-host:8081
#   NEXUS_USER     : usuario nexus
#   NEXUS_PASS     : password nexus
#   SONAR_HOST     : http://sonar-host:9000
#   SONAR_TOKEN    : token sonarqube
# =============================================================================

variables:
  MAVEN_OPTS: >
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Djava.awt.headless=true
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

# Cache del repositorio local Maven - acelera los builds evitando re-descarga
cache:
  key:
    files:
      - pom.xml
    prefix: "${CI_JOB_NAME}"
  paths:
    - .m2/repository/
  policy: pull-push

# ---------------------------------------------------------------------------
stages:
  - validate
  - build
  - test
  - security
  - package
  - publish
  - deploy

# ---------------------------------------------------------------------------
# Escaneo de secretos - SIEMPRE se ejecuta, nunca se salta
# ---------------------------------------------------------------------------
.secret-scan: &secret-scan
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache grep
  script:
    - |
      echo "=== Escaneo de secretos ==="
      FOUND=0

      # Detectar credenciales hardcodeadas en Java y configuración
      if grep -rn --include="*.java" --include="*.xml" \
         --include="*.properties" --include="*.yml" \
         -E '(password|passwd|secret|api_key|token)\s*[=:]\s*["'"'"'][^\$\{][^"'"'"']{3,}' \
         src/ 2>/dev/null; then
        echo "ERROR: Credenciales hardcodeadas detectadas."
        FOUND=1
      fi

      # Detectar archivos con extensiones sensibles
      if find . -not -path './.git/*' \
         \( -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.jks" \) \
         -print 2>/dev/null | grep -q .; then
        echo "ERROR: Archivos con claves/certificados encontrados en el repositorio."
        FOUND=1
      fi

      if [ "$FOUND" -eq 1 ]; then
        echo ""
        echo "BLOQUEADO: Resolver los problemas antes de continuar."
        exit 1
      fi
      echo "OK: Sin secretos detectados."
  rules:
    - when: always  # Siempre ejecutar

secret-scan:
  <<: *secret-scan

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean compile -DskipTests=true
  artifacts:
    paths:
      - target/classes/
    expire_in: 1 hour

# ---------------------------------------------------------------------------
# Tests unitarios + cobertura
# ---------------------------------------------------------------------------
unit-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS test
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
    expire_in: 1 week
  rules:
    - if: '$SKIP_TESTS != "true"'

# ---------------------------------------------------------------------------
# Seguridad - OWASP y SonarQube en paralelo
# ---------------------------------------------------------------------------
owasp-dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-17
  script:
    - |
      mvn $MAVEN_CLI_OPTS \
        org.owasp:dependency-check-maven:check \
        -DfailBuildOnCVSS=7 \
        -Dformat=HTML,JSON \
        -DsuppressionFile=owasp-suppressions.xml || true
  artifacts:
    paths:
      - target/dependency-check-report.*
    expire_in: 1 week
  allow_failure: false

sonarqube:
  stage: security
  image: maven:3.9-eclipse-temurin-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    - |
      mvn $MAVEN_CLI_OPTS verify sonar:sonar \
        -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}" \
        -Dsonar.projectName="${CI_PROJECT_NAME}" \
        -Dsonar.host.url="${SONAR_HOST}" \
        -Dsonar.login="${SONAR_TOKEN}" \
        -Dsonar.gitlab.project_id="${CI_PROJECT_ID}" \
        -Dsonar.gitlab.commit_sha="${CI_COMMIT_SHA}"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ---------------------------------------------------------------------------
# Package
# ---------------------------------------------------------------------------
package:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests=true
    - echo "Artefactos generados:"
    - find target -maxdepth 1 \( -name "*.jar" -o -name "*.war" -o -name "*.ear" \) -ls
  artifacts:
    paths:
      - target/*.jar
      - target/*.war
      - target/*.ear
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Publicar en Nexus
# ---------------------------------------------------------------------------
publish-nexus:
  stage: publish
  image: maven:3.9-eclipse-temurin-17
  script:
    - |
      APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
      if echo "$APP_VERSION" | grep -q "SNAPSHOT"; then
        NEXUS_REPO="maven-snapshots"
      else
        NEXUS_REPO="maven-releases"
      fi
      echo "Publicando en Nexus repo: ${NEXUS_REPO}"
      mvn $MAVEN_CLI_OPTS deploy \
        -DskipTests=true \
        -DaltDeploymentRepository="nexus::default::${NEXUS_URL}/repository/${NEXUS_REPO}/" \
        -s <(cat <<EOF
      <settings>
        <servers>
          <server>
            <id>nexus</id>
            <username>${NEXUS_USER}</username>
            <password>${NEXUS_PASS}</password>
          </server>
        </servers>
      </settings>
      EOF
        )
  rules:
    # Solo publicar en branches main/master/develop o tags
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# Deploy QA (manual, solo desde rama develop)
# ---------------------------------------------------------------------------
deploy-qa:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
  script:
    - echo "Desplegando en QA..."
    # Personalizar según el servidor Mule/Wildfly de QA
    - echo "Deploy completado en QA"
  environment:
    name: qa
    url: http://qa-server:8080
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  allow_failure: false
