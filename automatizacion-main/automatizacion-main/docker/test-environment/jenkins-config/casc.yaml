jenkins:
  systemMessage: "Ambiente de Prueba - Jenkins + Nexus + Servers Destino"
  numExecutors: 4
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"
          properties:
            - mailer:
                emailAddress: "admin@test.local"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# ── Credenciales ──────────────────────────────────────────────────
credentials:
  system:
    domainCredentials:
      - credentials:
          # GitHub: usuario/token para clonar el repositorio
          # Si el repo es público, GITHUB_TOKEN puede dejarse vacío.
          # Si es privado: export GITHUB_TOKEN=ghp_xxx  (antes de start-test-env.sh)
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              description: "Credenciales GitHub para clonar el repositorio (opcional si es público)"
              username: "${GITHUB_USER:-git}"
              password: "${GITHUB_TOKEN:-}"

          # SSH key para acceso a target-servers (inyectada por start-test-env.sh)
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "ssh-deploy-key"
              description: "Clave SSH para acceso a servers destino"
              username: "deploy"
              privateKeySource:
                directEntry:
                  privateKey: "${SSH_PRIVATE_KEY}"

          # Nexus: URL como secret text
          - string:
              scope: GLOBAL
              id: "nexus-url"
              description: "URL de Nexus Repository Manager"
              secret: "http://nexus:8081"

          # Nexus: usuario/contraseña
          - usernamePassword:
              scope: GLOBAL
              id: "nexus-credentials"
              description: "Credenciales admin de Nexus"
              username: "admin"
              password: "nexus123"

          # Email de notificaciones (stub para test env)
          - string:
              scope: GLOBAL
              id: "notification-email"
              description: "Email para notificaciones del pipeline"
              secret: "admin@test.local"

          # SonarQube (stub - no disponible en test env)
          - string:
              scope: GLOBAL
              id: "sonarqube-url"
              description: "[STUB] URL de SonarQube"
              secret: "http://sonarqube:9000"

          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "[STUB] Token de SonarQube"
              secret: "stub-sonar-token"

          # Vault (stub - no disponible en test env)
          - string:
              scope: GLOBAL
              id: "vault-address"
              description: "[STUB] Dirección de Vault"
              secret: "http://vault:8200"

          - string:
              scope: GLOBAL
              id: "vault-token"
              description: "[STUB] Token de Vault"
              secret: "stub-vault-token"

# ── Herramientas (Maven auto-instalado, JDK del contenedor) ──────
tool:
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"
  jdk:
    installations:
      - name: "JDK-17"
        home: "/opt/java/openjdk"
      - name: "JDK-18"
        home: "/opt/java/openjdk"

# ── Configuración global ──────────────────────────────────────────
unclassified:
  location:
    url: "http://jenkins:8080/"
    adminAddress: "admin@test.local"
  mailer:
    smtpHost: "localhost"
    smtpPort: "25"
    charset: "UTF-8"

  # ── Shared Library global ──────────────────────────────────────
  # Solución al error: "No version 1 found for library shared-library"
  # La shared-library vive en cicd/jenkins/shared-library/ dentro del repo.
  # Al definirla aquí con defaultVersion: main, @Library('shared-library') _
  # en Jenkinsfile-java-maven resuelve correctamente sin necesitar un tag "1".
  globalLibraries:
    libraries:
      - name: "shared-library"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            # Ruta al directorio raíz de la biblioteca dentro del repositorio
            libraryPath: "cicd/jenkins/shared-library/"
            scm:
              git:
                credentialsId: "github-credentials"
                remote: "https://github.com/infra-neo/automatizacion.git"
                traits:
                  - gitBranchDiscovery

# ── Jobs (auto-creados vía Job DSL al arrancar Jenkins) ───────────
# Solución al error: 'checkout scm' is only available when using
# "Multibranch Pipeline" or "Pipeline script from SCM"
# El job 'maven' se crea como "Pipeline script from SCM" apuntando
# al repositorio Git, lo que habilita el uso de 'checkout scm'.
jobs:
  - script: |
      pipelineJob('maven') {
        description('Pipeline CI/CD Java Maven - Ambiente de Prueba\nFuente: jenkins/Jenkinsfile-java-maven-test')
        keepDependencies(false)
        parameters {
          choiceParam(
            'ENVIRONMENT',
            ['qa', 'staging', 'production'],
            'Entorno de despliegue'
          )
          booleanParam(
            'SKIP_TESTS',
            false,
            'Omitir tests unitarios'
          )
          booleanParam(
            'DEPLOY_AFTER_BUILD',
            true,
            'Desplegar en target-servers al terminar el build'
          )
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/infra-neo/automatizacion.git')
                  // Credencial opcional: necesaria solo si el repo es privado
                  credentials('github-credentials')
                }
                branches('*/main')
                extensions {
                  // Clonar solo lo necesario (más rápido)
                  cloneOptions {
                    shallow(true)
                    depth(1)
                    noTags(true)
                  }
                }
              }
            }
            // Ruta al Jenkinsfile dentro del repositorio
            scriptPath('jenkins/Jenkinsfile-java-maven-test')
            // lightweight: solo descarga el Jenkinsfile para arrancar el pipeline
            // checkout scm dentro del pipeline hará el clone completo
            lightweight(true)
          }
        }
      }
