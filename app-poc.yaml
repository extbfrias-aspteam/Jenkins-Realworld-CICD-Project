apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-bancaria-app
  namespace: default
  labels:
    app: poc-bancaria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poc-bancaria
  template:
    metadata:
      labels:
        app: poc-bancaria
    spec:
      containers:
      - name: web-server
        image: nginx:alpine  # Imagen inicial funcional para la Demostración 1
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "128Mi"
            cpu: "250m"
          requests:
            memory: "64Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: poc-bancaria-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: poc-bancaria
