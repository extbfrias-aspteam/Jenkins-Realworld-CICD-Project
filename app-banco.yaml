apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-banking
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: angular-frontend
  template:
    metadata:
      labels:
        app: angular-frontend
    spec:
      containers:
      - name: html-empresarial
        image: localhost:5000/html-empresarial:v1.0.0
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: domain-banking-service
  namespace: apps
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: angular-frontend
